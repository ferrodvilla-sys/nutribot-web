# Ajustes generales del sitio. Cambia aquí y se aplica en todas las páginas.
title: Nutribot
tagline: Tus alergias e intolerancias, en cada producto que escaneas
description: >-
  App para personas con alergias e intolerancias alimentarias: escanea productos,
  detecta alérgenos y FODMAP en los ingredientes sin falsos positivos y lleva un
  diario de comidas y síntomas. Android, 30 días gratis.
url: "https://nutribot.eu"
baseurl: ""
lang: es_ES
author: Nutribot
# Titular legal: solo sale en Aviso legal y Términos (la ley pide identificarlo)
titular: Fernando Rodríguez Villa

# Enlaces que se usan en botones y pie de página
play_store_url: "https://play.google.com/store/apps/details?id=com.fernandorodriguezvilla.nutribot"
privacy_url: "https://sites.google.com/view/politica-privacidad-nutribot/inicio"
contact_email: "nutribotappl@gmail.com"
# Página de Facebook (si está vacío, el enlace no sale en la web)
facebook_url: "https://www.facebook.com/profile.php?id=61595046641595"

# Contador de visitas (GoatCounter: gratis, sin cookies). Es el nombre de la cuenta
# creada en goatcounter.com; las visitas se ven en https://nutribot.goatcounter.com
goatcounter: nutribot

# Precio (si cambias el precio, cámbialo solo aquí)
price_month: "3,99 €"
price_year: "29,99 €"
price_year_month: "2,50 €"
trial_days: 30

permalink: /blog/:title/
timezone: Europe/Madrid

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Etiquetas: una página por síntoma, intolerancia, ingrediente o alergia (carpeta _etiquetas).
# Cada artículo lleva "etiquetas: [gases, lactosa]" con el nombre del archivo de la etiqueta.
collections:
  etiquetas:
    output: true
    permalink: /etiqueta/:name/

# Orden de los grupos de etiquetas en el blog
grupos_etiquetas: [Síntomas, Intolerancias, Ingredientes, Alergias]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Temas del blog. Cada artículo lleva "tema:" con uno de estos nombres.
temas:
  - nombre: Etiquetas
    imagen: /assets/img/ilus/etiquetas.svg
    descripcion: Aprende a leer lo que de verdad lleva un producto.
  - nombre: Alergias
    imagen: /assets/img/ilus/alergias.svg
    descripcion: Vivir con alergias e intolerancias en el día a día.
  - nombre: FODMAP
    imagen: /assets/img/ilus/fodmap.svg
    descripcion: Gases, hinchazón y los alimentos que suelen estar detrás.
  - nombre: Hábitos
    imagen: /assets/img/ilus/habitos.svg
    descripcion: Pequeños cambios para comer mejor y conocerte más.

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: etiquetas
    values:
      layout: etiqueta
